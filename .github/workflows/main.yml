name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare and Build APK
        run: |
          find . -name "*.zip" -exec unzip -o {} \; || true
          FOUND_GRADLE=$(find . -name "settings.gradle" | head -n 1)
          if [ -n "$FOUND_GRADLE" ]; then
            cd "$(dirname "$FOUND_GRADLE")"
          fi
          gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-Offline-APK
          path: "**/app-debug.apk"
