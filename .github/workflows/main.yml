name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Locate Project and Build APK
        run: |
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \; || true
          PROJ_DIR=$(dirname "$(find . -name 'settings.gradle' | head -n 1)")
          cd "$PROJ_DIR"
          gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-Offline-APK
          path: "**/app-debug.apk"
